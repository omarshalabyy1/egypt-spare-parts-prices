# The warehouse (Postgres), Airflow's own metadata Postgres, and Airflow. All on 127.0.0.1 only.
#
#   docker compose up -d --build   # Airflow http://127.0.0.1:8100 (no login), warehouse localhost:5450
#   docker compose down            # stops everything; the data volumes stay
#
# Settings come from .env (gitignored; copy .env.example).

name: egypt-spare-parts-prices

services:
  warehouse:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: parts
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:?set in .env}
      POSTGRES_DB: parts
    ports:
      - "127.0.0.1:5450:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parts -d parts"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-db:  # Airflow's own records, never in the warehouse
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow:
    build: .
    image: egypt-spare-parts-prices:3.3.2
    # Scheduler, DAG processor and API server in one container. If one of them stops,
    # the container exits and Docker restarts it.
    command: >-
      bash -c "airflow db migrate && { airflow scheduler & airflow dag-processor & airflow api-server --port 8080 & wait -n; exit 1; }"
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "6"  # one fetch task per site at once; small: the laptop shares 7 GB of Docker memory
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "6"
      AIRFLOW__API__WORKERS: "1"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      PYTHONPATH: /opt/project  # so the DAG can import tracker.py
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      MAIL_TO: ${MAIL_TO:-}
    ports:
      - "127.0.0.1:8100:8080"
    volumes:
      - airflow-home:/opt/airflow
      - ./dags:/opt/airflow/dags
      - .:/opt/project
    depends_on:
      warehouse:
        condition: service_healthy
      airflow-db:
        condition: service_healthy

volumes:
  warehouse-data:
  airflow-db-data:
  airflow-home:
