<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" role="img" aria-label="The scraping funnel. Seller sites, each with one scraper module, are read by a fetcher with a named User-Agent, one request every 3 seconds and retries after 2, 4 and 8 seconds. Every page is kept gzipped in the raw cache (bronze), then parsed into offers. A schema check sends bad rows to quarantine, kept and not dropped. Good offers are matched to our parts by part number, then price gaps and undercuts are worked out, ending in the weekly alert and the Power BI report. Next Monday the loop starts again at the fetcher.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2563EB"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; fill: #0E1630; }
    .title { font-size: 21px; font-weight: 700; }
    .sub { font-size: 13.5px; fill: #475569; }
    .b { font-size: 15px; font-weight: 700; }
    .d { font-size: 12.5px; fill: #475569; }
    .c { font-size: 13px; font-weight: 700; fill: #2563EB; }
    .m { font-family: Consolas, Menlo, monospace; font-size: 12px; fill: #475569; }
    .on { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #C3CCDC; stroke-width: 1.5; }
    .ln { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#a); }
    .loop { fill: none; stroke: #2563EB; stroke-width: 2; stroke-dasharray: 4 6; marker-end: url(#b); animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
  </style>

  <rect x="1" y="1" width="898" height="788" rx="22" fill="#F4F6FB" stroke="#DCE2EE"/>
  <text x="30" y="44" class="title">The scraping funnel</text>
  <text x="30" y="68" class="sub">Every week, wide at the top: many pages in, a few answers out. Each step only reads what the one above kept.</text>

  <!-- 1 seller sites -->
  <rect x="140" y="92" width="640" height="56" rx="10" class="box"/>
  <text x="460" y="115" class="b" text-anchor="middle"><!--n:sellers-->5<!--/n--> seller sites</text>
  <text x="460" y="136" class="d" text-anchor="middle">one module per seller, the same two parts: a PAGES list and parse(body, url) → offers + next page</text>
  <path d="M460 148V176" class="ln"/>

  <!-- 2 fetch -->
  <rect x="170" y="178" width="580" height="56" rx="10" class="box"/>
  <text x="460" y="201" class="b" text-anchor="middle">fetch</text>
  <text x="460" y="222" class="d" text-anchor="middle">named User-Agent · 1 request / 3 s · retry 2 → 4 → 8 s · JSON API before listing pages</text>
  <path d="M460 234V262" class="ln"/>
  <text x="472" y="253" class="c"><!--n:pages-->727<!--/n--> pages</text>

  <!-- 3 raw cache -->
  <rect x="200" y="264" width="520" height="56" rx="10" class="box"/>
  <text x="460" y="287" class="b" text-anchor="middle">pages cached gzipped (bronze)</text>
  <text x="460" y="308" class="m" text-anchor="middle">data/raw/&lt;seller&gt;/&lt;week&gt;/*.gz + index.jsonl · <!--n:raw_mb-->17<!--/n--> MB</text>
  <path d="M460 320V348" class="ln"/>
  <text x="472" y="339" class="d">a rerun re-parses, never re-fetches</text>

  <!-- 4 parse -->
  <rect x="230" y="350" width="460" height="56" rx="10" class="box"/>
  <text x="460" y="373" class="b" text-anchor="middle">parse</text>
  <text x="460" y="394" class="d" text-anchor="middle">page → offers: title, brand, part number, price in EGP</text>
  <path d="M460 406V434" class="ln"/>
  <text x="472" y="425" class="c"><!--n:offers-->12,613<!--/n--> offers</text>

  <!-- 5 schema check diamond with the quarantine branch -->
  <path d="M390 476L460 436L530 476L460 516Z" class="box"/>
  <text x="460" y="473" class="b" text-anchor="middle" font-size="13">schema</text>
  <text x="460" y="490" class="b" text-anchor="middle" font-size="13">check</text>
  <path d="M530 476H608" class="ln"/>
  <text x="569" y="467" class="d" text-anchor="middle">bad row</text>
  <rect x="610" y="448" width="230" height="56" rx="10" class="box" stroke-dasharray="5 4"/>
  <text x="626" y="471" class="c"><!--n:quarantined-->0<!--/n--> quarantined</text>
  <text x="626" y="492" class="d">kept with the reason, not dropped</text>
  <path d="M460 516V546" class="ln"/>
  <text x="472" y="536" class="d">good rows</text>

  <!-- 6 match -->
  <rect x="260" y="548" width="400" height="56" rx="10" class="box"/>
  <text x="460" y="571" class="b" text-anchor="middle">match by part number</text>
  <text x="460" y="592" class="c" text-anchor="middle"><!--n:matched_parts-->pending run 2<!--/n--> of <!--n:parts-->pending run 2<!--/n--> parts</text>
  <path d="M460 604V632" class="ln"/>

  <!-- 7 gap and undercut -->
  <rect x="290" y="634" width="340" height="56" rx="10" class="box"/>
  <text x="460" y="657" class="b" text-anchor="middle">price gap and undercut</text>
  <text x="460" y="678" class="c" text-anchor="middle"><!--n:undercuts-->pending run 2<!--/n--> undercuts</text>
  <path d="M460 690V718" class="ln"/>

  <!-- 8 weekly outputs -->
  <rect x="320" y="720" width="280" height="44" rx="10" fill="#2563EB"/>
  <text x="460" y="747" class="on" text-anchor="middle">weekly alert + Power BI</text>

  <!-- the weekly loop back to the fetcher -->
  <path d="M320 742H70V206H168" class="loop"/>
  <text x="58" y="474" class="b" font-size="13" text-anchor="middle" transform="rotate(-90 58 474)">next Monday: back to the fetch</text>
</svg>
