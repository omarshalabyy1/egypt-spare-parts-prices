<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Egypt spare parts price tracker. Every week: where each of our parts is cheaper at a competitor, and by how much. {PARTS} parts, {SELLERS} sellers, {CHEAPER_PCT}% cheaper somewhere, median gap {MEDIAN_GAP_PCT}%. Illustration: an oil filter with our price tag and a lower competitor price tag.">
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 34px; font-weight: 700; fill: #0F172A; }
    .sub { font-size: 15px; fill: #475569; }
    .result { font-size: 16px; font-weight: 600; fill: #0F172A; }
    .price { font-size: 18px; font-weight: 700; fill: #0F172A; }
    .label { font-size: 11.5px; fill: #64748B; }
  </style>

  <rect x="1" y="1" width="898" height="248" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="40" y="92" class="title">Egypt spare parts price tracker</text>
  <text x="40" y="126" class="sub">Every week: where each of our parts is cheaper at a competitor, and by how much.</text>
  <line x1="40" y1="160" x2="300" y2="160" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <text x="40" y="200" class="result">{PARTS} parts · {SELLERS} sellers · {CHEAPER_PCT}% cheaper somewhere · median gap {MEDIAN_GAP_PCT}%</text>

  <!-- Oil filter outline -->
  <g fill="none" stroke="#475569" stroke-width="2">
    <rect x="712" y="52" width="46" height="14" rx="4"/>
    <rect x="700" y="66" width="70" height="104" rx="9"/>
    <path d="M714 80 V156 M728 80 V156 M742 80 V156 M756 80 V156" stroke="#CBD5E1"/>
  </g>

  <!-- Our tag and the competitor's lower tag -->
  <text x="806" y="50" class="label">ours</text>
  <path d="M810 58 H886 V94 H810 L794 76 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="806" cy="76" r="3.5" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <text x="848" y="83" class="price" text-anchor="middle">EGP 285</text>

  <path d="M810 116 H886 V152 H810 L794 134 Z" fill="#F59E0B"/>
  <circle cx="806" cy="134" r="3.5" fill="#F8FAFC"/>
  <text x="848" y="141" class="price" text-anchor="middle">EGP 257</text>
  <text x="806" y="170" class="label">a competitor</text>
</svg>
