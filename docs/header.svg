<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Egypt spare parts price tracker. Every week: where each of our parts is cheaper at a competitor, and by how much: parts, sellers, the share cheaper somewhere and the median gap. Illustration: an oil filter with our price tag and a lower competitor price tag.">
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 34px; font-weight: 700; fill: #0E1630; }
    .sub { font-size: 15px; fill: #475569; }
    .result { font-size: 16px; font-weight: 600; fill: #0E1630; }
    .tag { font-size: 14px; font-weight: 700; fill: #0E1630; }
    .tagon { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .label { font-size: 12px; fill: #475569; }
  </style>

  <rect x="1" y="1" width="898" height="248" rx="22" fill="#F4F6FB" stroke="#DCE2EE"/>

  <text x="40" y="78" class="title">Egypt spare parts price tracker</text>
  <text x="40" y="110" class="sub">Every week: where each of our parts is cheaper at a competitor, and by how much.</text>
  <line x1="40" y1="138" x2="300" y2="138" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <text x="40" y="176" class="result"><!--n:parts-->pending run 2<!--/n--> parts · <!--n:sellers-->5<!--/n--> sellers</text>
  <text x="40" y="204" class="result"><!--n:cheaper_pct-->pending run 2<!--/n-->% cheaper somewhere · median gap <!--n:median_gap_pct-->pending run 2<!--/n-->%</text>

  <!-- Oil filter outline -->
  <g fill="none" stroke="#475569" stroke-width="2">
    <rect x="712" y="52" width="46" height="14" rx="4"/>
    <rect x="700" y="66" width="70" height="104" rx="9"/>
    <path d="M714 80 V156 M728 80 V156 M742 80 V156 M756 80 V156" stroke="#C3CCDC"/>
  </g>

  <!-- Our tag and the competitor's lower tag: illustration only, not measured prices -->
  <text x="806" y="50" class="label">ours</text>
  <path d="M810 58 H886 V94 H810 L794 76 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="806" cy="76" r="3.5" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <text x="848" y="81" class="tag" text-anchor="middle">our price</text>

  <path d="M810 116 H886 V152 H810 L794 134 Z" fill="#2563EB"/>
  <circle cx="806" cy="134" r="3.5" fill="#F4F6FB"/>
  <text x="848" y="139" class="tagon" text-anchor="middle">cheaper</text>
  <text x="806" y="170" class="label">a competitor</text>
</svg>
