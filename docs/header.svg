<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Egypt spare parts price tracker. 12,613 prices from 5 Egyptian sellers in one weekly run. Three dots on one price line: the same belt at three sellers, the cheapest in amber.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#16233B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .tag { font-size: 13px; fill: #94A3B8; letter-spacing: 1.5px; }
    .name { font-size: 38px; font-weight: 800; fill: #FFFFFF; }
    .result { font-size: 18px; fill: #CBD5E1; }
    .hot { fill: #F59E0B; font-weight: 700; }
    .val { font-size: 13px; font-weight: 600; fill: #E2E8F0; }
    .note { font-size: 12.5px; fill: #94A3B8; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 50% { transform: scale(2); opacity: 0.25; } }
  </style>

  <rect width="1000" height="260" rx="22" fill="url(#bg)"/>
  <circle cx="810" cy="130" r="170" fill="url(#glow)"/>

  <text x="50" y="66" class="tag">PROJECT · SPARE PARTS PRICES</text>
  <text x="50" y="118" class="name">Egypt spare parts price tracker</text>
  <text x="50" y="160" class="result"><tspan class="hot"><!--n:offers-->12,613<!--/n--> prices</tspan> from <tspan class="hot"><!--n:sellers-->5<!--/n--> Egyptian sellers</tspan> in one weekly run</text>
  <text x="50" y="216" class="tag">PYTHON · AIRFLOW · POSTGRESQL · POWER BI</text>

  <!-- the same 6PK2360 belt at three sellers on one EGP line: 446.00, 790.00, 957.60 -->
  <line x1="690" y1="130" x2="950" y2="130" stroke="#475569" stroke-width="2"/>
  <circle cx="845" cy="130" r="7" fill="#CBD5E1"/>
  <circle cx="912" cy="130" r="7" fill="#CBD5E1"/>
  <circle cx="707" cy="130" r="7" fill="#F59E0B"/>
  <circle cx="707" cy="130" r="7" fill="#F59E0B" class="pulse"/>
  <text x="707" y="108" class="val" text-anchor="middle">446.00</text>
  <text x="845" y="108" class="val" text-anchor="middle">790.00</text>
  <text x="912" y="108" class="val" text-anchor="middle">957.60</text>
  <text x="690" y="166" class="note">One belt, three sellers, prices in EGP</text>
</svg>
