<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="How it works: 01 Scrape, each seller site read with a named User-Agent, 1 request every 3 seconds, raw pages kept; 02 Check, every row schema-checked, bad rows to quarantine; 03 Store, every price kept with its date, append-only; 04 Match, each offer to our part by part number or name; 05 Alert, an email when a competitor undercuts us; 06 Report, Power BI gaps and undercuts by part.">
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #0E1630; }
    .sub { font-size: 13.5px; fill: #475569; }
    .numon { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    .step { font-size: 15px; font-weight: 700; fill: #0E1630; }
    .desc { font-size: 12px; fill: #475569; }
    .box { fill: #FFFFFF; stroke: #C3CCDC; }
    .link { fill: none; stroke: #2563EB; stroke-width: 2; stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
  </style>

  <rect x="1" y="1" width="898" height="258" rx="22" fill="#F4F6FB" stroke="#DCE2EE"/>
  <text x="31" y="50" class="title">How it works</text>
  <text x="31" y="74" class="sub">One Airflow run a week. Scraping is the first step; everything after it reads the kept pages.</text>

  <path class="link" d="M159 165h14M301 165h14M443 165h14M585 165h14M727 165h14"/>

  <g>
    <rect x="31" y="100" width="128" height="130" rx="12" class="box"/>
    <circle cx="55" cy="126" r="13" fill="#2563EB"/>
    <text x="55" y="130" class="numon" text-anchor="middle">01</text>
    <text x="75" y="131" class="step">Scrape</text>
    <text x="43" y="166" class="desc"><!--n:sellers-->5<!--/n--> seller sites,</text>
    <text x="43" y="184" class="desc">1 request / 3 s,</text>
    <text x="43" y="202" class="desc">raw pages kept</text>
  </g>
  <g>
    <rect x="173" y="100" width="128" height="130" rx="12" class="box"/>
    <circle cx="197" cy="126" r="13" fill="#2563EB"/>
    <text x="197" y="130" class="numon" text-anchor="middle">02</text>
    <text x="217" y="131" class="step">Check</text>
    <text x="185" y="166" class="desc">every row schema-</text>
    <text x="185" y="184" class="desc">checked; bad rows</text>
    <text x="185" y="202" class="desc">go to quarantine</text>
  </g>
  <g>
    <rect x="315" y="100" width="128" height="130" rx="12" class="box"/>
    <circle cx="339" cy="126" r="13" fill="#2563EB"/>
    <text x="339" y="130" class="numon" text-anchor="middle">03</text>
    <text x="359" y="131" class="step">Store</text>
    <text x="327" y="166" class="desc">every price kept</text>
    <text x="327" y="184" class="desc">with its date,</text>
    <text x="327" y="202" class="desc">append-only</text>
  </g>
  <g>
    <rect x="457" y="100" width="128" height="130" rx="12" class="box"/>
    <circle cx="481" cy="126" r="13" fill="#2563EB"/>
    <text x="481" y="130" class="numon" text-anchor="middle">04</text>
    <text x="501" y="131" class="step">Match</text>
    <text x="469" y="166" class="desc">each offer to our</text>
    <text x="469" y="184" class="desc">part, by part</text>
    <text x="469" y="202" class="desc">number or name</text>
  </g>
  <g>
    <rect x="599" y="100" width="128" height="130" rx="12" class="box"/>
    <circle cx="623" cy="126" r="13" fill="#2563EB"/>
    <text x="623" y="130" class="numon" text-anchor="middle">05</text>
    <text x="643" y="131" class="step">Alert</text>
    <text x="611" y="166" class="desc">an email when a</text>
    <text x="611" y="184" class="desc">competitor</text>
    <text x="611" y="202" class="desc">undercuts us</text>
  </g>
  <g>
    <rect x="741" y="100" width="128" height="130" rx="12" class="box"/>
    <circle cx="765" cy="126" r="13" fill="#2563EB"/>
    <text x="765" y="130" class="numon" text-anchor="middle">06</text>
    <text x="785" y="131" class="step">Report</text>
    <text x="753" y="166" class="desc">Power BI: gaps</text>
    <text x="753" y="184" class="desc">and undercuts</text>
    <text x="753" y="202" class="desc">by part</text>
  </g>
</svg>
