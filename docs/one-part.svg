<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="One part, three sellers, one Monday. The same 6PK2360 belt, one piece, at three sellers in the first weekly run, in Egyptian pounds: Pringi 427.00, Auto Spare 500.00, GE Trading 739.00 shown out of stock. The dearest in stock is 17.1% above the cheapest. Every Monday our price for this part is compared with the cheapest seller; below ours is an undercut alert. A loop arrow: next Monday the same comparison runs again.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#16233B"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13.5px; fill: #CBD5E1; }
    .seller { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .val { font-size: 14px; font-weight: 700; fill: #E2E8F0; }
    .item { font-size: 12.5px; fill: #94A3B8; }
    .axis { font-size: 12px; fill: #64748B; }
    .hot { font-size: 13px; font-weight: 700; fill: #F59E0B; }
    .cap { font-size: 13px; fill: #CBD5E1; }
    .loop { fill: none; stroke: #F59E0B; stroke-width: 2; stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
  </style>

  <rect width="1000" height="480" rx="22" fill="url(#bg)"/>
  <text x="40" y="52" class="title">One part, three sellers, one Monday</text>
  <text x="40" y="76" class="sub">The same 6PK2360 belt, one piece, at three sellers in the first weekly run, in Egyptian pounds (EGP).</text>

  <!-- scale: 0 EGP at x=250, 0.6 px per EGP -->
  <g stroke="#334155" stroke-width="1">
    <line x1="400" y1="105" x2="400" y2="318"/>
    <line x1="550" y1="105" x2="550" y2="318"/>
    <line x1="700" y1="105" x2="700" y2="318"/>
    <line x1="850" y1="105" x2="850" y2="318"/>
  </g>
  <line x1="250" y1="105" x2="250" y2="320" stroke="#475569" stroke-width="1.5"/>
  <line x1="250" y1="320" x2="860" y2="320" stroke="#475569" stroke-width="1.5"/>
  <g class="axis" text-anchor="middle">
    <text x="250" y="338">0</text>
    <text x="400" y="338">250</text>
    <text x="550" y="338">500</text>
    <text x="700" y="338">750</text>
    <text x="850" y="338">1,000 EGP</text>
  </g>

  <!-- Pringi 427.00: each seller's cheapest comparable listing in gold, run week 2026-10-05 -->
  <text x="40" y="131" class="seller">Pringi</text>
  <rect x="250" y="118" width="256.2" height="16" rx="4" fill="#F59E0B"/>
  <text x="518" y="131" class="val">427.00</text>
  <text x="572" y="131" class="hot">cheapest</text>
  <text x="250" y="156" class="item" direction="rtl" text-anchor="end">“سير مجموعة مقاس 6PK2360 – شيرى نيو تيجو موديل (2014 – 2018)”</text>

  <!-- Auto Spare 500.00 -->
  <text x="40" y="209" class="seller">Auto Spare</text>
  <rect x="250" y="196" width="300" height="16" rx="4" fill="#CBD5E1"/>
  <text x="562" y="209" class="val">500.00</text>
  <text x="250" y="234" class="item" direction="rtl" text-anchor="end">“سير مجموعة 6pk 2360 شيري اريزو 5”</text>

  <!-- GE Trading 739.00, shown out of stock: left out of the comparison -->
  <text x="40" y="287" class="seller">GE Trading</text>
  <rect x="251" y="275" width="441.4" height="14" rx="4" fill="none" stroke="#64748B" stroke-width="2"/>
  <text x="705" y="287" class="val">739.00</text>
  <text x="762" y="287" class="item">shown out of stock</text>
  <text x="250" y="312" class="item">“Belt 6PK2360 [DAYCO](Made In China)”</text>

  <!-- the spread, between the cheapest and the dearest in stock -->
  <path d="M506.2 356v8h43.8v-8" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="528" y="384" class="hot" text-anchor="middle">+17.1%</text>

  <text x="40" y="418" class="cap">The dearest in stock is 17.1% above the cheapest: 500.00 ÷ 427.00 = 1.171.</text>
  <text x="40" y="442" class="cap">Every Monday our price for this part is compared with the cheapest seller;</text>
  <text x="40" y="462" class="cap">below ours = an undercut alert.</text>

  <!-- next Monday: the same comparison again -->
  <circle cx="935" cy="440" r="16" class="loop"/>
  <path d="M929 418 L937 424 L929 430" fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="910" y="445" class="hot" text-anchor="end">next Monday</text>
</svg>
