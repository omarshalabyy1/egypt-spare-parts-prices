<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-label="Data flow, table by table: the weekly Airflow DAG reads 13 Egyptian spare-parts sites, one request every 3 seconds per site, and keeps every page gzipped on disk under data/raw, logged in bronze.page (4,754 pages in run week 2026-10-05). load_silver parses the pages into silver.offer and the append-only silver.price_observation, and sets 1,094 bad rows aside in silver.quarantine. load_reference loads the 13 sellers from config/client.yaml and our 935 parts from catalogue.csv. match writes silver.offer_match. build_gold rebuilds the star: fact_price_observation (28,825 offers, 10,312 of them matched to our parts), dim_seller (13), dim_part (936) and dim_date (1), and the views price_gap (2,708 rows), undercut (1,415), undercut_alert and price_change, the last two empty until a second week is loaded. Power BI reads gold into three pages, the notebook computes every README number, and send_alert emails the undercut alerts and records each email in silver.alert_sent.">
